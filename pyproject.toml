[project]
name = "rag-chatbot-pydantic-ai-prototype"
version = "0.1.0"
description = "RAG chatbot for Telekom press releases"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic-ai>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "cohere>=5.0",
    "sqlite-vec>=0.1",
    "openai>=1.0",
    "arize-phoenix>=8.0",
    "opentelemetry-api>=1.0",
    "opentelemetry-sdk>=1.0",
    "openinference-instrumentation-openai>=0.1",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
    "ty>=0.0",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ty]
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
