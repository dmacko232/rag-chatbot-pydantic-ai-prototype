[tool.poetry]
name = "rag-chatbot"
version = "0.1.0"
description = "RAG chatbot for Deutsche Telekom press releases"
authors = ["Dominik Macko"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.11"
pydantic-ai = "^0.1"
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }
sqlmodel = "^0.0.22"
sqlite-vec = "^0.1"
cohere = "^5.13"
openai = "^1.66"
python-jose = { version = "^3.3", extras = ["cryptography"] }
passlib = { version = "^1.7", extras = ["bcrypt"] }
python-multipart = "^0.0.20"
httpx = "^0.28"
arize-phoenix = {version = "^8.0", extras = ["evals"]}
openinference-instrumentation-openai = "^0.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11"
ty = "^0.0"
pre-commit = "^4.1"
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
httpx = "^0.28"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ty]
src = ["src"]
